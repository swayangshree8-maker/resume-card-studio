services:
  - type: web
    name: resume-card-studio-control
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT webcontrol.app:app
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: sway
      - key: ADMIN_PASSWORD
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGIN
        value: https://swayangshree8-maker.github.io
      - key: DATABASE_PATH
        value: /tmp/control.sqlite3
